<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#161618" />
    <meta
      name="description"
      content="A calm AAC board for typing, tapping phrases, speaking them, or showing them large."
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="AAC" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>AAC</title>
    <script>
      try {
        var backgrounds = { dark: "#161618", soft: "#2a2724", light: "#e6e6eb" };
        var theme = "dark";
        var raw = localStorage.getItem("julesaac.v1");
        if (raw) {
          var data = JSON.parse(raw);
          var settings = data.settings || (data.data && data.data.settings);
          if (settings && (settings.theme === "dark" || settings.theme === "soft" || settings.theme === "light")) {
            theme = settings.theme;
          }
        }
        document.documentElement.setAttribute("data-theme", theme);
        document.documentElement.style.background = backgrounds[theme];
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", backgrounds[theme]);
      } catch (error) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    </script>
  </head>
  <body>
    <noscript>
      <p style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding: 1.5rem; color: #f5f5f7; background: #161618;">
        AAC needs JavaScript to run in this browser.
      </p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
